<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DICT R2 AAR Generator</title>
  <script src="./config.js"></script>
  <script>
    // config.js is gitignored (it holds API keys) and may not exist on a
    // fresh clone. Fall back to an empty config so the app still boots;
    // keys are normally provided via the server-side proxy instead.
    if (typeof CONFIG === "undefined") { window.CONFIG = {}; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
