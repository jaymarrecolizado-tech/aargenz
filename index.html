<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AAR Generator - Test</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="./config.js"></script>
  <script>
    // config.js is gitignored (it holds API keys) and may not exist on a
    // fresh clone. Fall back to an empty config so the app still boots;
    // keys are normally provided via the server-side proxy (api/chat.js /
    // server.js env vars) instead.
    if (typeof CONFIG === "undefined") { window.CONFIG = {}; }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    const HEADER_IMG = "./header.png";
    const FOOTER_IMG = "./footer.png";

    const SYSTEM_PROMPT = `You are an assistant helping fill out an Accomplishment Activity Report (AAR) for DICT (Department of Information and Communications Technology) Philippines.

    Your job is to collect information through a friendly conversation, ONE question at a time. Ask the next question only after getting an answer.
    
    Collect these fields in order:
    1. Activity title
    2. Date and time (e.g. "December 2-3, 2025 | 9:00am - 5:00pm")
    3. Mode/Platform/Location (e.g. "Face-to-Face" or "Online via Zoom")
    4. Control number (e.g. "eLGU-R2-12-04-2025-S157")
    5. DICT Facilitators - ask for each: Name, Office, Gender (M/F). Ask how many facilitators first, then collect each one.
    6. Beneficiary breakdown: how many Male/Female from NGAs, LGUs, SUCs, Others
    7. What was the activity about? (for Rationale - you will write the formal rationale based on their answer)
    8. Key topics/modules discussed and outcomes (for Highlights - you will write the formal highlights based on their answer)
    9. Name and position of the person who prepared the report
    10. Name and position of the person who will conform/approve the report
    
    After collecting ALL fields, output ONLY a valid JSON object (no markdown, no explanation) in this exact format:
    {
      "title": "",
      "dateTime": "",
      "mode": "",
      "controlNo": "",
      "facilitators": [{"name": "", "office": "", "gender": ""}],
      "beneficiaries": {"ngas": {"male": 0, "female": 0}, "lgus": {"male": 0, "female": 0}, "sucs": {"male": 0, "female": 0}, "others": {"male": 0, "female": 0}},
      "rationale": "",
      "highlights": "",
      "preparedBy": {"name": "", "position": ""},
      "conformedBy": {"name": "", "position": ""}
    }
    
    Important:
    - Write rationale and highlights in formal, professional government report style (2-3 paragraphs each)
    - Only output the JSON when ALL fields are collected
    - Keep conversation friendly and clear
    - If user says "done" or "that's all" when adding facilitators or asking for more, accept it`;

    const INITIAL_MESSAGE = {
      role: "assistant",
      content: "Hello! I'll help you create your Accomplishment Activity Report. Let's start — what is the **title of the activity**?"
    };

    // ---------------------------------------------------------------------------
    // Helpers (module scope)
    // ---------------------------------------------------------------------------

    const DEFAULT_REPORT = {
      title: "", dateTime: "", mode: "", controlNo: "",
      facilitators: [],
      beneficiaries: {
        ngas: { male: 0, female: 0 },
        lgus: { male: 0, female: 0 },
        sucs: { male: 0, female: 0 },
        others: { male: 0, female: 0 }
      },
      rationale: "", highlights: "",
      preparedBy: { name: "", position: "" },
      conformedBy: { name: "", position: "" }
    };

    const BEN_KEYS = ["ngas", "lgus", "sucs", "others"];
    // Models sometimes capitalize the beneficiary category keys ("NGAs",
    // "LGUs", "SUCs", "Others" — e.g. Groq's gpt-oss-120b). Look them up
    // case-insensitively so counts are never silently zeroed.
    const pickBenCat = (ben, key) => {
      if (!ben || typeof ben !== "object") return undefined;
      if (ben[key] !== undefined) return ben[key];
      const match = Object.keys(ben).find(k => k.toLowerCase() === key);
      return match !== undefined ? ben[match] : undefined;
    };

    const normalizeReport = (raw) => {
      const d = { ...DEFAULT_REPORT, ...(raw || {}) };
      const ben = d.beneficiaries || {};
      d.beneficiaries = {};
      for (const k of BEN_KEYS) {
        const cat = pickBenCat(ben, k);
        d.beneficiaries[k] = {
          male: Number(cat?.male) || 0,
          female: Number(cat?.female) || 0
        };
      }
      d.facilitators = Array.isArray(d.facilitators)
        ? d.facilitators.map(f => ({ name: f?.name || "", office: f?.office || "", gender: f?.gender || "" }))
        : [];
      d.preparedBy = { ...DEFAULT_REPORT.preparedBy, ...(d.preparedBy || {}) };
      d.conformedBy = { ...DEFAULT_REPORT.conformedBy, ...(d.conformedBy || {}) };
      return d;
    };

    const extractJson = (text) => {
      if (!text) return null;
      const cleaned = String(text)
        .replace(/```(?:json)?\s*/gi, "")
        .replace(/```/g, "")
        .trim();
      const candidates = [cleaned];
      const match = cleaned.match(/\{[\s\S]*\}/);
      if (match) candidates.push(match[0]);
      for (const c of candidates) {
        try { return JSON.parse(c); } catch { /* try next candidate */ }
      }
      return null;
    };

    const loadSavedState = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("aar-state") || "null");
        if (saved && typeof saved === "object") return saved;
      } catch { /* ignore corrupted storage */ }
      return null;
    };

    const SAVED_STATE = loadSavedState();

    const compressImage = (file, maxDim = 1280, quality = 0.85) => new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          const scale = Math.min(1, maxDim / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => resolve(reader.result);
        img.src = reader.result;
      };
      reader.onerror = () => resolve(null);
      reader.readAsDataURL(file);
    });

    // ---------------------------------------------------------------------------
    // AI provider configuration. Lets you swap the live Groq-hosted model for a
    // local model (Ollama / LM Studio / llama.cpp / vLLM) via the OpenAI-
    // compatible chat completions API. See LOCAL_AI_PLAN.md.
    //
    //   AI_PROVIDER: "groq"  → cloud only via Groq API (default)
    //                "local" → local only (errors if unreachable)
    //                "auto"  → local first, Groq fallback
    //   LOCAL_BASE_URL: base URL of the local OpenAI-compatible server
    //   LOCAL_MODEL: model name served by the local server
    // ---------------------------------------------------------------------------

    const AI_DEFAULTS = {
      AI_PROVIDER: CONFIG?.AI_PROVIDER || "groq",
      LOCAL_BASE_URL: (CONFIG?.LOCAL_BASE_URL || "http://localhost:11434/v1").replace(/\/+$/, ""),
      LOCAL_MODEL: CONFIG?.LOCAL_MODEL || "qwen3:14b",
      LOCAL_TIMEOUT_MS: CONFIG?.LOCAL_TIMEOUT_MS || 120000
    };

    const loadAiOverrides = () => {
      try {
        const saved = JSON.parse(localStorage.getItem("aar-ai-config") || "null");
        return saved && typeof saved === "object" ? saved : {};
      } catch { return {}; }
    };

    const effectiveAiConfig = (overrides = {}) => ({ ...AI_DEFAULTS, ...overrides });

    const fetchWithTimeout = async (url, options, timeoutMs) => {
      const ctrl = new AbortController();
      const timer = setTimeout(() => ctrl.abort(), timeoutMs);
      try {
        return await fetch(url, { ...options, signal: ctrl.signal });
      } finally {
        clearTimeout(timer);
      }
    };

    const openAiBody = (messages, model, extra = {}) => JSON.stringify({
      model,
      max_tokens: 4000,
      temperature: 0.2, // lower temperature = more deterministic output
      // NOTE: no response_format here on purpose. The assistant collects data
      // ONE question at a time (see SYSTEM_PROMPT) and only emits the final
      // JSON at the end; forcing json_object on every turn makes strict models
      // (e.g. Groq's gpt-oss-120b) reject ordinary question turns. The final
      // JSON is guaranteed by the system prompt + robust extractJson().
      messages,
      ...extra
    });

    // ---------------------------------------------------------------------------
    // OpenAI-compatible streaming (SSE). Calls onToken(fullText) as tokens
    // arrive; falls back to buffered JSON parsing for proxies that don't stream.
    // ---------------------------------------------------------------------------

    const readSseStream = async (res, onToken) => {
      const reader = res.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let fullText = "";

      const handleLine = (line) => {
        const trimmed = line.trim();
        if (!trimmed.startsWith("data:")) return;
        const payload = trimmed.slice(5).trim();
        if (payload === "[DONE]") return;
        try {
          const json = JSON.parse(payload);
          const delta = json.choices?.[0]?.delta?.content ?? "";
          if (delta) {
            fullText += delta;
            onToken?.(fullText);
          }
        } catch { /* ignore keepalive / comments */ }
      };

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        const lines = buffer.split("\n");
        buffer = lines.pop() ?? "";
        lines.forEach(handleLine);
      }
      if (buffer.trim()) handleLine(buffer);
      return fullText;
    };

    const readCompletion = async (res, onToken) => {
      const ct = res.headers.get("content-type") || "";
      if (ct.includes("text/event-stream") || ct.includes("application/x-ndjson")) {
        const fullText = await readSseStream(res, onToken);
        if (fullText) return fullText;
        throw new Error("Empty streamed response");
      }
      // Buffered OpenAI JSON response (older proxies or error bodies)
      const data = await res.json().catch(() => ({}));
      const text = data.choices?.[0]?.message?.content ?? "";
      if (!text) throw new Error(data.error?.message || "Empty response (" + res.status + ")");
      onToken?.(text);
      return text;
    };

    const openrouterStream = async (messages, onToken) => {
      if (!CONFIG?.OPENROUTER_API_KEY) {
        throw new Error("No OpenRouter API key available in config.js");
      }
      const model = CONFIG?.OPENROUTER_MODEL || "meta-llama/llama-3.3-70b-versatile";
      const res = await fetchWithTimeout("https://openrouter.ai/api/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${CONFIG.OPENROUTER_API_KEY}`
        },
        body: openAiBody(messages, model, { stream: true })
      }, 90000);
      return readCompletion(res, onToken);
    };

    // Shared key-pool parser (file:// mode). Accepts either an array
    // (XXX_API_KEYS: ["k1","k2"]) or a comma-separated string, and falls back
    // to the single XXX_API_KEY. When the active key hits its rate limit
    // (HTTP 429) or is rejected (401/403), the request retries with the next
    // key in the pool automatically.
    const parseKeys = (listCfg, singleCfg) => {
      let list = Array.isArray(listCfg) ? listCfg : (typeof listCfg === "string" ? listCfg.split(",") : []);
      list = list.map(k => String(k).trim()).filter(Boolean);
      if (!list.length && singleCfg) list = [String(singleCfg).trim()];
      return list;
    };
    const getGroqKeys = () => parseKeys(CONFIG?.GROQ_API_KEYS, CONFIG?.GROQ_API_KEY);
    // xAI (Grok) keys – the automatic fallback provider used when every Groq
    // key is rate-limited or rejected.
    const getXaiKeys = () => parseKeys(CONFIG?.XAI_API_KEYS, CONFIG?.XAI_API_KEY);

    // Index of the last key that worked; new requests start from it so a
    // healthy key is preferred and exhausted keys are only hit when they're the
    // only option.
    const groqKeyCursor = { current: 0 };
    const xaiKeyCursor = { current: 0 };

    // Tries every key in a provider pool (up to `passes` full rotations),
    // streaming to onToken. Throws once the whole pool is exhausted; the error
    // carries .keyExhausted = true when only key issues (429/401/403) were hit.
    const poolStream = async ({ url, model, keys, cursor, label, messages, onToken }) => {
      let lastErr = null;
      let keyExhausted = true;
      const passes = 3; // up to 3 full rotations through the pool
      for (let pass = 0; pass < passes; pass++) {
        for (let i = 0; i < keys.length; i++) {
          const idx = (cursor.current + i) % keys.length;
          try {
            const res = await fetchWithTimeout(url, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": `Bearer ${keys[idx]}`
              },
              body: openAiBody(messages, model, { stream: true })
            }, 90000);
            if (!res.ok) {
              const status = res.status;
              const errText = await res.text().catch(() => "");
              // Key-related failures (rate limit / invalid key) → next key.
              if ([401, 403, 429].includes(status)) {
                console.warn(`${label} key ${idx + 1}/${keys.length} returned ${status}; trying next key`);
                lastErr = new Error(`${label} ${status}: ${errText.slice(0, 300) || "key rejected"}`);
                await new Promise(r => setTimeout(r, 500));
                continue;
              }
              keyExhausted = false;
              throw new Error(`${label} ${status}: ${errText.slice(0, 300) || "unknown error"}`);
            }
            cursor.current = idx; // remember the key that worked
            return await readCompletion(res, onToken);
          } catch (e) {
            if (e.keyExhausted) throw e; // already classified by a nested pool
            lastErr = e;
            const retryable = /5\d\d|ECONN|fetch failed|network|timeout|abort/i.test(e.message || "");
            if (!retryable) { e.keyExhausted = false; throw e; }
            await new Promise(r => setTimeout(r, 500)); // transient — try next key
          }
        }
        // Finished a full pass without success: advance the cursor so the next
        // pass starts from a different key, with backoff between passes.
        cursor.current = (cursor.current + 1) % keys.length;
        await new Promise(r => setTimeout(r, 1000 * Math.pow(2, pass)));
      }
      const err = lastErr || new Error(`All ${label} API keys failed`);
      err.keyExhausted = keyExhausted;
      throw err;
    };

    // Provider chain: Groq keys first, then xAI (Grok) keys as the automatic
    // fallback when every Groq key is rate-limited / rejected.
    const groqStream = async (messages, onToken) => {
      const tiers = [
        { url: "https://api.groq.com/openai/v1/chat/completions", model: "openai/gpt-oss-120b", keys: getGroqKeys(), cursor: groqKeyCursor, label: "Groq" },
        { url: "https://api.x.ai/v1/chat/completions", model: CONFIG?.XAI_MODEL || "grok-4.6", keys: getXaiKeys(), cursor: xaiKeyCursor, label: "xAI" }
      ].filter(t => t.keys.length);
      if (!tiers.length) {
        throw new Error("No Groq/xAI API key available. Add GROQ_API_KEY/GROQ_API_KEYS (or XAI_API_KEY/XAI_API_KEYS) to config.js locally or deploy the api/chat proxy with them set.");
      }
      let lastErr = null;
      for (const tier of tiers) {
        try {
          return await poolStream({ ...tier, messages, onToken });
        } catch (e) {
          // Fall through to the next provider only when this pool was exhausted
          // by key issues (rate limit / rejected key). Other errors surface.
          if (!e.keyExhausted) throw e;
          lastErr = e;
          console.warn(`${tier.label} keys exhausted, trying next provider:`, e.message);
        }
      }
      throw lastErr || new Error("All API providers failed");
    };

    // Sends the conversation to the model, streaming tokens to onToken as they
    // arrive. Resolution order:
    //   1. /api/chat proxy (server mode) – routes to local model or Groq.
    //   2. No proxy (file:// / static): local model directly ("local"/"auto"),
    //      then Groq direct, then OpenRouter as a final cloud fallback.
    const streamChat = async (messages, onToken, overrides = {}) => {
      const cfg = effectiveAiConfig(overrides);

      try {
        const proxyRes = await fetchWithTimeout("api/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: openAiBody(messages, cfg.LOCAL_MODEL, { provider: cfg.AI_PROVIDER, stream: true })
        }, 180000);
        if (proxyRes.ok) return await readCompletion(proxyRes, onToken);
        const errText = await proxyRes.text().catch(() => "");
        console.warn("Proxy returned " + proxyRes.status + ":", errText.slice(0, 200));
      } catch (e) {
        console.warn("Proxy unavailable:", e.message);
      }

      if (cfg.AI_PROVIDER !== "groq") {
        try {
          const res = await fetchWithTimeout(cfg.LOCAL_BASE_URL + "/chat/completions", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: openAiBody(messages, cfg.LOCAL_MODEL, { stream: true })
          }, cfg.LOCAL_TIMEOUT_MS);
          return await readCompletion(res, onToken);
        } catch (e) {
          if (cfg.AI_PROVIDER === "local") throw e; // strict local mode
          console.warn("Local model unavailable, falling back to cloud:", e.message);
        }
      }

      try {
        return await groqStream(messages, onToken);
      } catch (groqErr) {
        if (CONFIG?.OPENROUTER_API_KEY) {
          console.warn("Groq unavailable, trying OpenRouter:", groqErr.message);
          return await openrouterStream(messages, onToken);
        }
        throw groqErr;
      }
    };

    function ReportPreview({ data, photos, onUpdate, headerImg, footerImg }) {
      const [editField, setEditField] = useState(null);
      const [editValue, setEditValue] = useState("");
      const [editDeep, setEditDeep] = useState(null);
      
      const facilitatorMale = data.facilitators.filter(f => f.gender?.toUpperCase() === "M").length;
      const facilitatorFemale = data.facilitators.filter(f => f.gender?.toUpperCase() === "F").length;

      const b = data.beneficiaries;
      const benMale = (b.ngas?.male||0)+(b.lgus?.male||0)+(b.sucs?.male||0)+(b.others?.male||0);
      const benFemale = (b.ngas?.female||0)+(b.lgus?.female||0)+(b.sucs?.female||0)+(b.others?.female||0);
      const totalMale = facilitatorMale + benMale;
      const totalFemale = facilitatorFemale + benFemale;

      const startEdit = (field, value, deep = null) => {
        setEditField(field);
        setEditValue(value || "");
        setEditDeep(deep);
      };

      const saveEdit = () => {
        if (editDeep) {
          onUpdate(editDeep, editValue);
        } else {
          onUpdate(editField, editValue);
        }
        setEditField(null);
        setEditValue("");
        setEditDeep(null);
      };

      const renderEditable = (field, value, deep = null) => {
        if (editField === field && editDeep === deep) {
          return (
            <input
              autoFocus
              value={editValue}
              onChange={e => setEditValue(e.target.value)}
              onBlur={saveEdit}
              onKeyDown={e => e.key === "Enter" && saveEdit()}
              style={{padding:"4px", width:"100%", border:"2px solid #0033cc", borderRadius:"4px"}}
            />
          );
        }
        return <span onClick={() => startEdit(field, value, deep)} style={{cursor:"pointer", background:editField===field?"#ffffcc":(onUpdate?"#f8f8f8":""), padding:"2px 4px", borderRadius:"3px"}}>{value}</span>;
      };

      return (
        <div id="report-preview" style={{fontFamily:"'Times New Roman', serif", fontSize:"11pt", color:"#000", background:"#fff", padding:"40px 48px", maxWidth:"800px", margin:"0 auto"}}>
          <div style={{marginBottom:"16px"}}>
            {headerImg ? (
              <img src={headerImg} alt="header" style={{width:"100%"}}/>
            ) : (
              <div style={{height:"80px", border:"2px dashed #ccc", display:"flex", alignItems:"center", justifyContent:"center", color:"#999"}}>
                No header image uploaded
              </div>
            )}
          </div>

          <table style={{width:"100%", borderCollapse:"collapse", marginBottom:"20px", border:"2px solid #0000cc"}}>
            <tbody>
              <tr>
                <td style={{background:"#0000cc", color:"#fff", fontWeight:"bold", padding:"6px 10px", width:"30%"}}>Title</td>
                <td style={{padding:"6px 10px", border:"1px solid #0000cc"}} colSpan="3">{renderEditable("title", data.title)}</td>
              </tr>
              <tr>
                <td style={{background:"#0000cc", color:"#fff", fontWeight:"bold", padding:"6px 10px"}}>Date and Time</td>
                <td style={{padding:"6px 10px", border:"1px solid #0000cc", fontWeight:"bold"}} colSpan="3">{renderEditable("dateTime", data.dateTime)}</td>
              </tr>
              <tr>
                <td style={{background:"#0000cc", color:"#fff", fontWeight:"bold", padding:"6px 10px"}}>Mode/Platform/Location</td>
                <td style={{padding:"6px 10px", border:"1px solid #0000cc"}}>{renderEditable("mode", data.mode)}</td>
                <td style={{background:"#0000cc", color:"#fff", fontWeight:"bold", padding:"6px 10px"}}>Control No.</td>
                <td style={{padding:"6px 10px", border:"1px solid #0000cc"}}>{renderEditable("controlNo", data.controlNo)}</td>
              </tr>
              <tr>
                <td style={{background:"#0000cc", color:"#fff", fontWeight:"bold", padding:"6px 10px"}}>Participants</td>
                <td style={{padding:"6px 10px", border:"1px solid #0000cc", color:"#0000cc", textDecoration:"underline"}} colSpan="3">Attached Attendance</td>
              </tr>
            </tbody>
          </table>

          <div style={{marginBottom:"20px"}}>
            <div style={{fontWeight:"bold", marginBottom:"8px"}}>I.&nbsp;&nbsp;&nbsp;RATIONALE</div>
            {data.rationale.split("\n").filter(p=>p.trim()).map((p,i) => (
              <p key={i} style={{textAlign:"justify", textIndent:"36px", marginBottom:"8px", lineHeight:"1.8"}}>{renderEditable("rationale", p)}</p>
            ))}
          </div>

          <div style={{marginBottom:"20px"}}>
            <div style={{fontWeight:"bold", marginBottom:"8px"}}>II.&nbsp;&nbsp;ATTENDEES</div>
            <div style={{fontWeight:"bold", fontStyle:"italic", marginBottom:"6px", paddingLeft:"24px"}}>A. Facilitator (DICT)</div>
            <table style={{width:"100%", borderCollapse:"collapse", marginBottom:"8px"}}>
              <thead>
                <tr>
                  {["Name","Office","Gender"].map(h => (
                    <th key={h} style={{background:"#0000cc", color:"#fff", padding:"6px 10px", border:"1px solid #0000cc"}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {data.facilitators.map((f,i) => (
                  <tr key={i}>
                    <td style={{padding:"5px 10px", border:"1px solid #ccc"}}>{f.name}</td>
                    <td style={{padding:"5px 10px", border:"1px solid #ccc"}}>{f.office}</td>
                    <td style={{padding:"5px 10px", border:"1px solid #ccc", textAlign:"center"}}>{f.gender}</td>
                  </tr>
                ))}
              </tbody>
            </table>
            <div style={{textAlign:"right", fontWeight:"bold", marginBottom:"16px"}}>Male: {facilitatorMale} | Female: {facilitatorFemale}</div>

            <div style={{fontWeight:"bold", fontStyle:"italic", marginBottom:"6px", paddingLeft:"24px"}}>B. NGAs / LGUs / SUCs and other Beneficiaries <span style={{fontStyle:"italic", fontWeight:"normal"}}>(please see attached attendance sheet)</span></div>
            <table style={{width:"100%", borderCollapse:"collapse", marginBottom:"8px"}}>
              <thead>
                <tr>
                  <th colSpan="2" style={{background:"#0000cc", color:"#fff", padding:"6px", border:"1px solid #0000cc"}}>NGAs</th>
                  <th colSpan="2" style={{background:"#0000cc", color:"#fff", padding:"6px", border:"1px solid #0000cc"}}>LGUs</th>
                  <th colSpan="2" style={{background:"#0000cc", color:"#fff", padding:"6px", border:"1px solid #0000cc"}}>SUCs</th>
                  <th colSpan="2" style={{background:"#0000cc", color:"#fff", padding:"6px", border:"1px solid #0000cc"}}>Others</th>
                </tr>
                <tr>
                  {["Male","Female","Male","Female","Male","Female","Male","Female"].map((g,i) => (
                    <th key={i} style={{background:"#eef", padding:"5px 6px", border:"1px solid #ccc", fontWeight:"normal"}}>{g}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                <tr>
                  {[b.ngas?.male,b.ngas?.female,b.lgus?.male,b.lgus?.female,b.sucs?.male,b.sucs?.female,b.others?.male,b.others?.female].map((v,i) => (
                    <td key={i} style={{padding:"5px 6px", border:"1px solid #ccc", textAlign:"center"}}>{v||""}</td>
                  ))}
                </tr>
              </tbody>
            </table>
            <div style={{textAlign:"right", fontWeight:"bold", marginBottom:"16px"}}>Male: {benMale} | Female: {benFemale}</div>

            <div style={{fontWeight:"bold", fontStyle:"italic", marginBottom:"6px", paddingLeft:"24px"}}>C. Consolidated participants</div>
            <table style={{width:"60%", borderCollapse:"collapse"}}>
              <tbody>
                <tr><td style={{padding:"5px 10px", border:"1px solid #ccc"}}>Total number of male attendees</td><td style={{padding:"5px 20px", border:"1px solid #ccc", textAlign:"center"}}>{totalMale}</td></tr>
                <tr><td style={{padding:"5px 10px", border:"1px solid #ccc"}}>Total number of female attendees</td><td style={{padding:"5px 20px", border:"1px solid #ccc", textAlign:"center"}}>{totalFemale}</td></tr>
                <tr><td style={{padding:"6px 10px", border:"1px solid #0000cc", background:"#0000cc", color:"#fff", fontWeight:"bold"}}>Total number of attendees</td><td style={{padding:"6px 20px", border:"1px solid #0000cc", background:"#0000cc", color:"#fff", fontWeight:"bold", textAlign:"center"}}>{totalMale+totalFemale}</td></tr>
              </tbody>
            </table>
          </div>

          <div style={{marginBottom:"20px"}}>
            <div style={{fontWeight:"bold", marginBottom:"8px"}}>III.&nbsp;HIGHLIGHTS OF DISCUSSION</div>
            {data.highlights.split("\n").filter(p=>p.trim()).map((p,i) => (
              <p key={i} style={{textAlign:"justify", textIndent:"36px", marginBottom:"8px", lineHeight:"1.8", paddingLeft:"24px"}}>{renderEditable("highlights", p)}</p>
            ))}
            <div style={{textAlign:"center", fontStyle:"italic", marginTop:"12px", fontSize:"9pt"}}>
              [{data.title} on {data.dateTime?.split("|")[0]?.trim()}]
            </div>
          </div>

          <div style={{marginBottom:"20px"}}>
            <div style={{fontWeight:"bold", marginBottom:"8px"}}>IV.&nbsp;&nbsp;ANNEXES</div>
            <div style={{fontWeight:"bold", fontStyle:"italic", marginBottom:"12px", paddingLeft:"24px"}}>A. PHOTOS <span style={{fontStyle:"italic", fontWeight:"normal"}}>(must be action picture)</span></div>
            {photos.length > 0 ? (
              <div>
                <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px", border:"2px solid #0000cc", padding:"4px"}}>
                  {photos.slice(0,4).map((p,i) => (
                    <img key={i} src={p} alt={`Photo ${i+1}`} style={{width:"100%", aspectRatio:"4/3", objectFit:"cover"}}/>
                  ))}
                </div>
                {photos.length > 4 && (
                  <div style={{display:"grid", gridTemplateColumns:"1fr 1fr", gap:"4px", border:"2px solid #0000cc", padding:"4px", marginTop:"4px"}}>
                    {photos.slice(4,8).map((p,i) => (
                      <img key={i+4} src={p} alt={`Photo ${i+5}`} style={{width:"100%", aspectRatio:"4/3", objectFit:"cover"}}/>
                    ))}
                  </div>
                )}
              </div>
            ) : (
              <div style={{border:"2px dashed #aaa", padding:"40px", textAlign:"center", color:"#999", margin:"0 0 16px 24px"}}>Upload photos using the button above</div>
            )}
          </div>

          <table style={{width:"100%", borderCollapse:"collapse", border:"1px solid #ccc"}}>
            <tbody>
              <tr>
                <td style={{padding:"12px 16px", border:"1px solid #ccc", width:"50%", verticalAlign:"top"}}>
                  <div style={{fontWeight:"bold", marginBottom:"40px"}}>Prepared by:</div>
                  <div style={{fontWeight:"bold"}}>{renderEditable("preparedBy.name", data.preparedBy?.name, "preparedBy.name")}</div>
                  <div>{renderEditable("preparedBy.position", data.preparedBy?.position, "preparedBy.position")}</div>
                </td>
                <td style={{padding:"12px 16px", border:"1px solid #ccc", verticalAlign:"top"}}>
                  <div style={{fontWeight:"bold", marginBottom:"40px"}}>Conformed by:</div>
                  <div style={{fontWeight:"bold"}}>{renderEditable("conformedBy.name", data.conformedBy?.name, "conformedBy.name")}</div>
                  <div>{renderEditable("conformedBy.position", data.conformedBy?.position, "conformedBy.position")}</div>
                </td>
              </tr>
            </tbody>
          </table>
          <div style={{marginTop:"8px", fontStyle:"italic", color:"#0000cc", fontSize:"10pt"}}>Copy furnish: eLGU Project Management Team</div>

          <div style={{marginTop:"20px", overflow:"hidden"}}>
            <div style={{display:"flex", justifyContent:"space-between", alignItems:"center", fontSize:"9pt", marginBottom:"6px"}}>
              <div style={{fontStyle:"italic"}}>[{data.title} on {data.dateTime?.split("|")[0]?.trim()}]</div>
              <div className="page-number-display" style={{fontWeight:"bold", color:"#0000cc"}}>PAGE 1 OF 1</div>
            </div>
            {footerImg ? (
              <img src={footerImg} alt="footer" style={{width:"100%", display:"block", marginTop:"4px"}}/>
            ) : (
              <div style={{height:"60px", border:"2px dashed #ccc", display:"flex", alignItems:"center", justifyContent:"center", color:"#999", marginTop:"4px"}}>
                No footer image uploaded
              </div>
            )}
          </div>
        </div>
      );
    }

    function AARApp() {
      const [tab, setTab] = useState("chat");
      const [messages, setMessages] = useState(SAVED_STATE?.messages?.length ? SAVED_STATE.messages : [INITIAL_MESSAGE]);
      const [input, setInput] = useState("");
      const [loading, setLoading] = useState(false);
      const [streamingText, setStreamingText] = useState(null);
      const [reportData, setReportData] = useState(SAVED_STATE?.reportData ? normalizeReport(SAVED_STATE.reportData) : null);
      const [photos, setPhotos] = useState([]);
      const [headerImgData, setHeaderImgData] = useState(HEADER_IMG);
      const [footerImgData, setFooterImgData] = useState(FOOTER_IMG);
      const [aiOverrides, setAiOverrides] = useState(loadAiOverrides());
      const chatRef = useRef(null);
      const fileRef = useRef(null);
      const headerRef = useRef(null);
      const footerRef = useRef(null);

      useEffect(() => {
        if (chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
      }, [messages, streamingText]);

      // Persist the conversation and report locally so a refresh doesn't lose work.
      useEffect(() => {
        try {
          localStorage.setItem("aar-state", JSON.stringify({ messages, reportData }));
        } catch { /* storage full – ignore */ }
      }, [messages, reportData]);

      const handleReset = () => {
        if (!window.confirm("Start a new report? This clears the current conversation and report.")) return;
        try { localStorage.removeItem("aar-state"); } catch { /* ignore */ }
        setMessages([INITIAL_MESSAGE]);
        setReportData(null);
        setPhotos([]);
        setTab("chat");
      };

      const updateAiOverrides = (patch) => {
        setAiOverrides(prev => {
          const next = { ...prev, ...patch };
          try { localStorage.setItem("aar-ai-config", JSON.stringify(next)); } catch { /* ignore */ }
          return next;
        });
      };

      const handleHeaderUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => setHeaderImgData(ev.target.result);
          reader.readAsDataURL(file);
        }
      };

      const handleFooterUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = ev => setFooterImgData(ev.target.result);
          reader.readAsDataURL(file);
        }
      };

      const sendMessage = async () => {
        if (!input.trim() || loading) return;
        const userMsg = { role: "user", content: input.trim() };
        const newMessages = [...messages, userMsg];
        setMessages(newMessages);
        setInput("");
        setLoading(true);
        setStreamingText("");

        try {
          const text = await streamChat([
            { role: "system", content: SYSTEM_PROMPT },
            ...newMessages.map(m => ({ role: m.role, content: m.content }))
          ], (partial) => setStreamingText(partial), aiOverrides);

          const parsed = extractJson(text);
          if (parsed) {
            setReportData(normalizeReport(parsed));
            setMessages(prev => [...prev, {
              role: "assistant",
              content: "✅ **Report data collected!** Click the **Preview Report** tab to see your formatted AAR. Don't forget to upload photos!"
            }]);
            setTab("preview");
          } else {
            setMessages(prev => [...prev, { role: "assistant", content: text || "No response" }]);
          }
        } catch (e) {
          console.error("API Error:", e);
          setMessages(prev => [...prev, { role: "assistant", content: "❌ Error: " + e.message }]);
        }
        setLoading(false);
        setStreamingText(null);
      };

      const handlePhotos = async (e) => {
        const files = Array.from(e.target.files);
        for (const f of files) {
          const dataUrl = await compressImage(f);
          if (dataUrl) setPhotos(prev => [...prev, dataUrl]);
        }
      };

      // Exports the current report as a sharegpt-format training example
      // (system prompt + conversation + final JSON), ready for fine-tuning.
      const handleDownloadDataset = () => {
        if (!reportData) return;
        const msgs = [
          { role: "system", content: SYSTEM_PROMPT },
          ...messages.map(m => ({ role: m.role, content: m.content }))
        ];
        // Replace the trailing "report collected" note with the model's JSON.
        const last = msgs[msgs.length - 1];
        if (last?.role === "assistant" && /Report data collected/.test(last.content)) msgs.pop();
        msgs.push({ role: "assistant", content: JSON.stringify(reportData) });

        const blob = new Blob([JSON.stringify({ messages: msgs }) + "\n"], { type: "application/x-ndjson" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `aar-dataset-${Date.now()}.jsonl`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };

      const escapeHtml = (value) => String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

      // -------------------------------------------------------------------------
      // PDF export – content blocks are paginated dynamically so the page
      // numbers ("PAGE X OF N") always match the actual printed pages.
      // -------------------------------------------------------------------------

      const buildFooterLabel = (data) => {
        const title = data.title || "";
        const date = (data.dateTime || "").split("|")[0]?.trim() || "";
        return `[${escapeHtml(title)} on ${escapeHtml(date)}]`;
      };

      const buildPdfBlocks = (data, photos, headerImgData) => {
        const b = data.beneficiaries || {};
        const facilitatorMale = data.facilitators.filter(f => f.gender?.toUpperCase() === "M").length;
        const facilitatorFemale = data.facilitators.filter(f => f.gender?.toUpperCase() === "F").length;
        const benMale = (b.ngas?.male||0)+(b.lgus?.male||0)+(b.sucs?.male||0)+(b.others?.male||0);
        const benFemale = (b.ngas?.female||0)+(b.lgus?.female||0)+(b.sucs?.female||0)+(b.others?.female||0);
        const totalMale = facilitatorMale + benMale;
        const totalFemale = facilitatorFemale + benFemale;
        const cell = value => escapeHtml(value || "");
        const num = value => Number(value || 0);
        const img = src => src ? escapeHtml(src) : "";
        const paras = value => String(value || "")
          .split(/\n+/).map(s => s.trim()).filter(Boolean);
        const blocks = [];

        if (headerImgData) {
          blocks.push(`<img class="pdf-header-img" src="${img(headerImgData)}" alt="header">`);
        }

        blocks.push(`<table class="info-table"><tbody>
          <tr><th>Title</th><td colspan="3">${cell(data.title)}</td></tr>
          <tr><th>Date and Time</th><td colspan="3"><strong>${cell(data.dateTime)}</strong></td></tr>
          <tr><th>Mode/Platform/Location</th><td>${cell(data.mode)}</td><th>Control No.</th><td>${cell(data.controlNo)}</td></tr>
          <tr><th>Participants</th><td colspan="3" class="linkish">Attached Attendance</td></tr>
        </tbody></table>`);

        blocks.push(`<h2>I. <span>RATIONALE</span></h2>`);
        paras(data.rationale).forEach(par => blocks.push(`<div class="para"><p>${cell(par)}</p></div>`));

        blocks.push(`<h2>II. <span>ATTENDEES</span></h2>`);

        const facilitatorRows = data.facilitators.map(f => `
          <tr><td>${cell(f.name)}</td><td>${cell(f.office)}</td><td class="center">${cell(f.gender)}</td></tr>
        `).join("");
        blocks.push(`<div class="keep">
          <h3>A. Facilitator (DICT)</h3>
          <table class="blue-table facilitator-table">
            <thead><tr><th>Name</th><th>Office</th><th>Gender</th></tr></thead>
            <tbody>${facilitatorRows}</tbody>
          </table>
          <div class="totals-line">Male: ${facilitatorMale} | Female: ${facilitatorFemale}</div>
        </div>`);

        blocks.push(`<div class="keep">
          <h3>B. NGAs / LGUs / SUCs and other Beneficiaries <em>(please see attached attendance sheet)</em></h3>
          <table class="blue-table beneficiary-table">
            <thead>
              <tr><th colspan="2">NGAs</th><th colspan="2">LGUs</th><th colspan="2">SUCs</th><th colspan="2">Others</th></tr>
              <tr class="subhead"><td>Male</td><td>Female</td><td>Male</td><td>Female</td><td>Male</td><td>Female</td><td>Male</td><td>Female</td></tr>
            </thead>
            <tbody>
              <tr>
                <td>${num(b.ngas?.male) || ""}</td><td>${num(b.ngas?.female) || ""}</td>
                <td>${num(b.lgus?.male) || ""}</td><td>${num(b.lgus?.female) || ""}</td>
                <td>${num(b.sucs?.male) || ""}</td><td>${num(b.sucs?.female) || ""}</td>
                <td>${num(b.others?.male) || ""}</td><td>${num(b.others?.female) || ""}</td>
              </tr>
            </tbody>
          </table>
          <div class="totals-line">Male: ${benMale} | Female: ${benFemale}</div>
        </div>`);

        blocks.push(`<div class="keep">
          <h3>C. Consolidated participants</h3>
          <table class="summary-table"><tbody>
            <tr><td>Total number of male attendees</td><td>${totalMale}</td></tr>
            <tr><td>Total number of female attendees</td><td>${totalFemale}</td></tr>
            <tr class="summary-total"><td>Total number of attendees</td><td>${totalMale + totalFemale}</td></tr>
          </tbody></table>
        </div>`);

        blocks.push(`<h2>III. <span>HIGHLIGHTS OF DISCUSSION</span></h2>`);
        paras(data.highlights).forEach(par => blocks.push(`<div class="para"><p>${cell(par)}</p></div>`));
        blocks.push(`<div class="para caption"><p>[${cell(data.title)} on ${cell((data.dateTime || "").split("|")[0]?.trim() || "")}]</p></div>`);

        blocks.push(`<h2>IV. <span>ANNEXES</span></h2>`);
        const photoSlots = (start) => [...Array(4)].map((_, i) => {
          const src = photos[start + i];
          return src
            ? `<div class="photo-slot"><img src="${img(src)}" alt="Photo ${start + i + 1}"></div>`
            : `<div class="photo-slot empty"></div>`;
        }).join("");
        blocks.push(`<div class="keep">
          <h3>A. PHOTOS <em>(must be action picture)</em></h3>
          <div class="photo-grid">${photoSlots(0)}</div>
          ${photos.length > 4 ? `<div class="photo-grid">${photoSlots(4)}</div>` : ""}
        </div>`);

        blocks.push(`<table class="signature-table"><tbody><tr>
          <td><strong>Prepared by:</strong><div class="signature-name">${cell(data.preparedBy?.name)}</div><div>${cell(data.preparedBy?.position)}</div></td>
          <td><strong>Conformed by:</strong><div class="signature-name">${cell(data.conformedBy?.name)}</div><div>${cell(data.conformedBy?.position)}</div></td>
        </tr></tbody></table>`);

        blocks.push(`<div class="copy-furnish">Copy furnish: eLGU Project Management Team</div>`);

        return blocks;
      };

      const handlePrint = () => {
        if (!reportData) return;

        const w = window.open("", "_blank");
        if (!w) return;

        const data = normalizeReport(reportData);
        const blocks = buildPdfBlocks(data, photos, headerImgData);
        const footerLabel = buildFooterLabel(data);
        const preloads = [headerImgData, footerImgData, FOOTER_IMG, ...photos.slice(0, 8)]
          .filter(Boolean)
          .map(src => `<img src="${escapeHtml(src)}" alt="" style="display:none">`)
          .join("");
        const payload = JSON.stringify({ blocks, footerLabel, footerImg: footerImgData || "" })
          .replace(/<\//g, "<\\/");

        const baseHref = document.baseURI;
        w.document.write(`<!DOCTYPE html><html><head><title>AAR Report</title>
        <base href="${baseHref}">
        <style>
          * { box-sizing: border-box; }
          @page { size: A4; margin: 0; }
          html, body { margin: 0; padding: 0; font-family: 'Times New Roman', serif; font-size: 11pt; color: #000; background: #fff; }
          .pdf-page { position: relative; width: 210mm; height: 297mm; overflow: hidden; background: #fff; page-break-after: always; break-after: page; }
          .pdf-page:last-child { page-break-after: auto; break-after: auto; }
          .top-pattern { position: absolute; top: 0; left: 0; width: 100%; height: 7mm; background-image: url("${FOOTER_IMG}"); background-size: 210mm auto; background-position: left bottom; background-repeat: no-repeat; }
          .pdf-content { position: absolute; left: 19mm; right: 19mm; bottom: 22mm; }
          .pdf-content.page-one { top: 13mm; }
          .pdf-content.continuation { top: 24mm; }
          .blk { padding-bottom: 4mm; }
          .pdf-header-img { display: block; width: 100%; margin: 0 auto 9mm; }
          table { border-collapse: collapse; width: 100%; }
          .info-table { margin-bottom: 11mm; border: 1.5px solid #0000cc; font-size: 10pt; }
          .info-table th { width: 31%; text-align: left; background: #0000cc; color: #fff; padding: 3px 7px; border: 1px solid #0000cc; font-weight: 700; }
          .info-table td { padding: 3px 7px; border: 1px solid #0000cc; vertical-align: middle; }
          .info-table .linkish { color: #0000cc; text-decoration: underline; }
          h2 { margin: 0 0 6mm; font-size: 11pt; font-weight: 700; }
          h2 span { margin-left: 8mm; }
          h3 { margin: 0 0 4mm 13mm; font-size: 10.5pt; font-style: italic; font-weight: 700; }
          h3 em { font-weight: 400; }
          .para { margin: 0; font-size: 10.5pt; line-height: 1.85; text-align: justify; }
          .para p { margin: 0 0 4mm; text-indent: 11mm; }
          .para.caption p { text-align: center; font-style: italic; font-size: 9pt; text-indent: 0; }
          .blue-table { margin: 0 0 2mm 18mm; width: calc(100% - 18mm); font-size: 10pt; }
          .blue-table th { background: #0000cc; color: #fff; border: 1px solid #0000cc; padding: 3px 6px; text-align: center; }
          .blue-table td { border: 1px solid #0000cc; padding: 3px 6px; }
          .center, .beneficiary-table td { text-align: center; }
          .beneficiary-table .subhead td { font-weight: 400; }
          .totals-line { text-align: right; font-weight: 700; margin: 0 0 13mm; font-size: 10pt; }
          .summary-table { margin: 0 0 15mm 18mm; width: calc(100% - 18mm); font-size: 10pt; }
          .summary-table td { border: 1px solid #0000cc; padding: 3px 6px; }
          .summary-table td:last-child { width: 34%; text-align: center; }
          .summary-total td { background: #0000cc; color: #fff; font-weight: 700; text-align: center; }
          .photo-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1mm; border: 1.5px solid #0000cc; padding: 1mm; margin: 12mm 0 14mm; }
          .photo-slot { height: 55mm; overflow: hidden; background: #f5f5f5; }
          .photo-slot img { display: block; width: 100%; height: 100%; object-fit: cover; }
          .signature-table { border: 1px solid #0000cc; font-size: 10pt; }
          .signature-table td { width: 50%; height: 32mm; border: 1px solid #0000cc; padding: 5mm 7mm 3mm; vertical-align: top; }
          .signature-name { margin-top: 14mm; font-weight: 700; text-align: center; text-transform: uppercase; }
          .signature-name + div { text-align: center; text-transform: uppercase; font-size: 9.5pt; }
          .copy-furnish { margin-top: 4mm; color: #0000cc; font-style: italic; font-size: 10pt; }
          .pdf-footer { position: absolute; left: 0; right: 0; bottom: 0; height: 22mm; }
          .pdf-footer-meta { position: absolute; left: 19mm; right: 19mm; bottom: 10mm; min-height: 7mm; font-size: 8.5pt; color: #0000cc; }
          .pdf-ref { position: absolute; left: 0; bottom: 3mm; max-width: 112mm; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; font-style: italic; font-weight: 700; }
          .pdf-page-no { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); color: #000; font-size: 8pt; }
          .pdf-footer-img { position: absolute; left: 0; right: 0; bottom: 0; width: 100%; display: block; }
          @media print {
            body { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
            img { max-width: 100% !important; }
          }
        </style>
        </head><body>
        <div id="pdf-pages"></div>
        ${preloads}
        <script>
        (function(){
          "use strict";
          var __PAYLOAD__ = ${payload};

          function run() {
            var MM = 96 / 25.4;
            var PAGE_H = 297 * MM;
            var BOTTOM = 22 * MM;
            var TOP_FIRST = 13 * MM;
            var TOP_CONT = 24 * MM;
            var container = document.getElementById("pdf-pages");
            var pages = [];
            var cur = null;

            function newPage(isFirst) {
              var page = document.createElement("div");
              page.className = "pdf-page";
              if (isFirst) {
                var pattern = document.createElement("div");
                pattern.className = "top-pattern";
                page.appendChild(pattern);
              }
              var content = document.createElement("div");
              content.className = "pdf-content" + (isFirst ? " page-one" : " continuation");
              page.appendChild(content);
              container.appendChild(page);
              var top = isFirst ? TOP_FIRST : TOP_CONT;
              cur = { content: content, used: 0, height: PAGE_H - top - BOTTOM };
              pages.push(cur);
            }

            function measure(html) {
              var probe = document.createElement("div");
              probe.className = "blk";
              probe.style.cssText = "position:absolute;left:-9999px;top:0;width:172mm;visibility:hidden;";
              probe.innerHTML = html;
              document.body.appendChild(probe);
              var h = probe.offsetHeight;
              document.body.removeChild(probe);
              return h;
            }

            newPage(true);
            __PAYLOAD__.blocks.forEach(function(html) {
              var h = measure(html);
              if (cur.used + h > cur.height) newPage(false);
              var div = document.createElement("div");
              div.className = "blk";
              div.innerHTML = html;
              cur.content.appendChild(div);
              cur.used += div.offsetHeight;
            });

            pages.forEach(function(p, i) {
              var footer = document.createElement("div");
              footer.className = "pdf-footer";
              footer.innerHTML =
                '<div class="pdf-footer-meta">' +
                  '<div class="pdf-ref">' + __PAYLOAD__.footerLabel + '</div>' +
                  '<div class="pdf-page-no">PAGE ' + (i + 1) + ' OF ' + pages.length + '</div>' +
                '</div>' +
                (__PAYLOAD__.footerImg ? '<img class="pdf-footer-img" src="' + __PAYLOAD__.footerImg + '" alt="footer">' : '');
              p.content.parentNode.appendChild(footer);
            });

            window.focus();
            window.print();
          }

          if (document.readyState === "complete") run();
          else window.addEventListener("load", run);
        })();
        <\/script>
        </body></html>`);
        w.document.close();
      };

      // -------------------------------------------------------------------------
      // RTF export
      // -------------------------------------------------------------------------

      const rtfEscape = (s) => {
        let out = "";
        for (const ch of String(s ?? "")) {
          const code = ch.codePointAt(0);
          if (ch === "\\" || ch === "{" || ch === "}") out += "\\" + ch;
          else if (ch === "\n") out += "\\par ";
          else if (ch === "\t") out += "\\tab ";
          else if (code < 128) out += ch;
          else if (code < 256) out += "\\'" + code.toString(16).padStart(2, "0");
          else out += "\\u" + code + "?";
        }
        return out;
      };

      const rtfTable = (rows, colWidths) => {
        const widths = [];
        let cum = 0;
        for (const w of colWidths) {
          cum += Math.round(w);
          widths.push(cum);
        }
        let out = "";
        rows.forEach((row, ri) => {
          out += "\\trowd\\trgaph108\\trleft0";
          if (ri === 0) {
            widths.forEach(ww => { out += "\\clcbpat1\\clbrdrt\\brdrs\\clbrdrl\\brdrs\\clbrdrb\\brdrs\\clbrdrr\\brdrs\\cellx" + ww; });
          } else {
            widths.forEach(ww => { out += "\\clbrdrt\\brdrs\\clbrdrl\\brdrs\\clbrdrb\\brdrs\\clbrdrr\\brdrs\\cellx" + ww; });
          }
          row.forEach((txt, ci) => {
            out += ri === 0
              ? "\\intbl{\\b\\fs20\\cf2 " + rtfEscape(txt) + "}\\cell "
              : "\\intbl{" + rtfEscape(txt) + "}\\cell ";
          });
          out += "\\row\n";
        });
        return out;
      };

      const base64ToHex = (b64) => {
        const bin = atob(b64);
        let hex = "";
        for (let i = 0; i < bin.length; i++) {
          hex += bin.charCodeAt(i).toString(16).padStart(2, "0");
        }
        return hex;
      };

      const rtfPictures = (photos) => {
        let out = "";
        photos.slice(0, 4).forEach(p => {
          const m = String(p).match(/^data:image\/(\w+);base64,(.*)$/);
          if (!m) return;
          try {
            const hex = base64ToHex(m[2]);
            out += "\\par{\\pict\\jpegblip " + hex + "}\\par ";
          } catch { /* skip unreadable image */ }
        });
        return out;
      };

      const buildRtf = (data, photos) => {
        const b = data.beneficiaries || {};
        const facilitatorMale = data.facilitators.filter(f => f.gender?.toUpperCase() === "M").length;
        const facilitatorFemale = data.facilitators.filter(f => f.gender?.toUpperCase() === "F").length;
        const benMale = (b.ngas?.male||0)+(b.lgus?.male||0)+(b.sucs?.male||0)+(b.others?.male||0);
        const benFemale = (b.ngas?.female||0)+(b.lgus?.female||0)+(b.sucs?.female||0)+(b.others?.female||0);
        const totalMale = facilitatorMale + benMale;
        const totalFemale = facilitatorFemale + benFemale;
        const W = 9644; // usable text width in twips (17 cm)
        const RESET = "\\pard\\plain\\f0\\fs22 ";
        const paras = (s) => String(s || "")
          .split(/\n+/).map(x => x.trim()).filter(Boolean)
          .map(x => "\\pard\\fi567\\sl360 " + rtfEscape(x) + "\\par")
          .join("\n");

        let rtf = "{\\rtf1\\ansi\\ansicpg1252\\deff0\n" +
          "{\\fonttbl{\\f0\\froman Times New Roman;}{\\f1\\fswiss Arial;}}\n" +
          "{\\colortbl;\\red0\\green0\\blue204;\\red255\\green255\\blue255;}\n" +
          "\\paperw11906\\paperh16838\n" +
          "\\margl1134\\margr1134\\margt1134\\margb1134\n" +
          RESET + "\n";

        rtf += RESET + "{\\b\\fs28 " + rtfEscape(data.title || "") + "}\\par\\par\n";
        rtf += RESET + "{\\b Date and Time:} " + rtfEscape(data.dateTime || "") + "\\par\n";
        rtf += RESET + "{\\b Mode/Platform/Location:} " + rtfEscape(data.mode || "") + "\\par\n";
        rtf += RESET + "{\\b Control No.:} " + rtfEscape(data.controlNo || "") + "\\par\\par\n";

        rtf += RESET + "{\\b I. RATIONALE}\\par\n" + paras(data.rationale) + "\n\\par\n";
        rtf += RESET + "{\\b II. ATTENDEES}\\par\n";
        rtf += RESET + "{\\b\\i A. Facilitator (DICT)}\\par\n";
        rtf += rtfTable([["Name", "Office", "Gender"], ...data.facilitators.map(f => [f.name || "", f.office || "", f.gender || ""])], [Math.round(W/3), Math.round(W/3), Math.round(W/3)]) + RESET + "\n";
        rtf += RESET + "Male: " + facilitatorMale + " | Female: " + facilitatorFemale + "\\par\\par\n";

        rtf += RESET + "{\\b\\i B. NGAs / LGUs / SUCs and other Beneficiaries (please see attached attendance sheet)}\\par\n";
        rtf += rtfTable([
          ["NGAs", "NGAs", "LGUs", "LGUs", "SUCs", "SUCs", "Others", "Others"],
          ["Male", "Female", "Male", "Female", "Male", "Female", "Male", "Female"],
          [b.ngas?.male || "", b.ngas?.female || "", b.lgus?.male || "", b.lgus?.female || "", b.sucs?.male || "", b.sucs?.female || "", b.others?.male || "", b.others?.female || ""]
        ], Array(8).fill(W / 8)) + RESET + "\n";
        rtf += RESET + "Male: " + benMale + " | Female: " + benFemale + "\\par\\par\n";

        rtf += RESET + "{\\b\\i C. Consolidated participants}\\par\n";
        rtf += rtfTable([
          ["Total number of male attendees", totalMale],
          ["Total number of female attendees", totalFemale],
          ["Total number of attendees", totalMale + totalFemale]
        ], [Math.round(W * 0.6), Math.round(W * 0.4)]) + RESET + "\n";

        rtf += RESET + "{\\b III. HIGHLIGHTS OF DISCUSSION}\\par\n" + paras(data.highlights) + "\n\\par\n";
        rtf += RESET + "{\\b IV. ANNEXES}\\par\n" + RESET + "{\\b\\i A. PHOTOS (must be action picture)}\\par\n";
        rtf += rtfPictures(photos) + "\n";
        rtf += RESET + "\\par\n";
        rtf += rtfTable([
          ["Prepared by:", "Conformed by:"],
          [data.preparedBy?.name || "", data.conformedBy?.name || ""],
          [data.preparedBy?.position || "", data.conformedBy?.position || ""]
        ], [Math.round(W / 2), Math.round(W / 2)]) + RESET + "\n";
        rtf += RESET + "{\\i Copy furnish: eLGU Project Management Team}\\par\n";
        rtf += "}";
        return rtf;
      };

      const handleExportRtf = () => {
        if (!reportData) return;
        const data = normalizeReport(reportData);
        const rtf = buildRtf(data, photos);
        const blob = new Blob([rtf], { type: "application/rtf" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `AAR-${(data.controlNo || "report").replace(/[^\w.-]+/g, "_")}.rtf`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 5000);
      };

      const updateReportData = (field, value) => {
        setReportData(prev => {
          if (field.includes('.')) {
            const [parent, child] = field.split('.');
            return { ...prev, [parent]: { ...prev[parent], [child]: value } };
          }
          return { ...prev, [field]: value };
        });
      };

      const renderMarkdown = (text) =>
        String(text ?? "").replace(/\*\*(.*?)\*\*/g, "<strong>$1</strong>").replace(/\n/g, "<br/>");

      const renderMessage = (msg, i) => {
        const isUser = msg.role === "user";
        return (
          <div key={i} style={{
            display:"flex", justifyContent: isUser ? "flex-end" : "flex-start",
            marginBottom:"12px"
          }}>
            {!isUser && (
              <div style={{width:"32px", height:"32px", borderRadius:"50%", background:"linear-gradient(135deg,#0033cc,#0099ff)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:"11px", fontWeight:"bold", flexShrink:0, marginRight:"8px", marginTop:"4px"}}>AI</div>
            )}
            <div style={{
              maxWidth:"72%", padding:"10px 14px", borderRadius: isUser ? "18px 18px 4px 18px" : "18px 18px 18px 4px",
              background: isUser ? "linear-gradient(135deg,#0033cc,#0055ff)" : "#f0f4ff",
              color: isUser ? "#fff" : "#1a1a2e",
              fontSize:"14px", lineHeight:"1.6", boxShadow:"0 2px 8px rgba(0,0,50,0.1)"
            }}
              dangerouslySetInnerHTML={{__html: renderMarkdown(msg.content)}}
            />
          </div>
        );
      };

      return (
        <div style={{
          fontFamily:"'Segoe UI', system-ui, sans-serif",
          minHeight:"100vh",
          background:"linear-gradient(135deg, #f0f4ff 0%, #e8f0fe 50%, #f5f0ff 100%)",
          display:"flex", flexDirection:"column"
        }}>
          <div style={{background:"linear-gradient(135deg,#0011aa,#0033cc)", padding:"14px 24px", display:"flex", alignItems:"center", gap:"16px", boxShadow:"0 2px 16px rgba(0,0,150,0.3)"}}>
            <div>
              <div style={{color:"#fff", fontSize:"18px", fontWeight:"900", letterSpacing:"-0.5px"}}>
                <span style={{color:"#66aaff"}}>e</span>LGU <span style={{color:"#ffaa33"}}>e</span><span style={{color:"#66ff88"}}>GOV</span><span style={{color:"#ff6666", fontSize:"12px"}}>PH</span>
                <span style={{color:"rgba(255,255,255,0.6)", fontSize:"13px", fontWeight:"400", marginLeft:"10px"}}>AAR Generator</span>
              </div>
              <div style={{color:"rgba(255,255,255,0.6)", fontSize:"11px", marginTop:"1px"}}>AI-Powered Accomplishment Activity Report</div>
            </div>
            <div style={{marginLeft:"auto", display:"flex", gap:"8px", alignItems:"center"}}>
              {["chat","preview"].map(t => (
                <button key={t} onClick={() => setTab(t)} style={{
                  padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600",
                  background: tab===t ? "#fff" : "rgba(255,255,255,0.15)",
                  color: tab===t ? "#0033cc" : "#fff", transition:"all .2s"
                }}>
                  {t === "chat" ? "💬 Chat" : "📄 Preview Report"}
                </button>
              ))}
              <button onClick={handleReset} style={{padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600", background:"rgba(255,255,255,0.15)", color:"#fff"}}>
                🔄 New Report
              </button>
              {reportData && tab==="preview" && (
                <>
                  <button onClick={() => fileRef.current?.click()} style={{padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600", background:"rgba(255,255,255,0.15)", color:"#fff"}}>
                    📷 Upload Photos
                  </button>
                  <button onClick={handlePrint} style={{padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600", background:"#ff6600", color:"#fff"}}>
                    Export PDF
                  </button>
                  <button onClick={handleExportRtf} style={{padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600", background:"#7a5af8", color:"#fff"}}>
                    📄 Export RTF
                  </button>
                  <button onClick={handleDownloadDataset} style={{padding:"7px 16px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"12px", fontWeight:"600", background:"rgba(255,255,255,0.15)", color:"#fff"}} title="Download this report as a fine-tuning example (sharegpt JSONL)">
                    📥 Dataset
                  </button>
                </>
              )}
              <div style={{display:"flex", alignItems:"center", gap:"6px", marginLeft:"8px"}} title="AI model: Auto = local model first, Groq fallback; Local = local only. Needs a local server (e.g. Ollama) running for local mode.">
                <select
                  value={aiOverrides.AI_PROVIDER || AI_DEFAULTS.AI_PROVIDER}
                  onChange={e => updateAiOverrides({ AI_PROVIDER: e.target.value })}
                  style={{padding:"5px 8px", borderRadius:"14px", border:"none", fontSize:"11px", fontWeight:"600", background:"rgba(255,255,255,0.15)", color:"#fff", cursor:"pointer", outline:"none"}}
                >
                  <option value="auto" style={{color:"#111"}}>Auto</option>
                  <option value="local" style={{color:"#111"}}>Local</option>
                  <option value="groq" style={{color:"#111"}}>Groq</option>
                </select>
                <input
                  value={aiOverrides.LOCAL_MODEL || AI_DEFAULTS.LOCAL_MODEL}
                  onChange={e => updateAiOverrides({ LOCAL_MODEL: e.target.value })}
                  placeholder="local model"
                  title="Local model name served by your local server (e.g. qwen3:14b)"
                  style={{width:"110px", padding:"5px 8px", borderRadius:"14px", border:"none", fontSize:"11px", background:"rgba(255,255,255,0.15)", color:"#fff", outline:"none"}}
                />
              </div>
              <button onClick={() => headerRef.current?.click()} style={{padding:"5px 12px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"11px", background:headerImgData?"#4CAF50":"rgba(255,255,255,0.15)", color:"#fff", marginLeft:"8px"}}>
                {headerImgData?"✓ Header":"📄 Header"}
              </button>
              <button onClick={() => footerRef.current?.click()} style={{padding:"5px 12px", borderRadius:"20px", border:"none", cursor:"pointer", fontSize:"11px", background:footerImgData?"#4CAF50":"rgba(255,255,255,0.15)", color:"#fff", marginLeft:"4px"}}>
                {footerImgData?"✓ Footer":"📄 Footer"}
              </button>
            </div>
          </div>
          <input ref={fileRef} type="file" multiple accept="image/*" style={{display:"none"}} onChange={handlePhotos}/>
          <input ref={headerRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleHeaderUpload}/>
          <input ref={footerRef} type="file" accept="image/*" style={{display:"none"}} onChange={handleFooterUpload}/>

          <div style={{flex:1, overflow:"auto", padding:"24px", display:"flex", justifyContent:"center"}}>
            {tab === "chat" ? (
              <div style={{width:"100%", maxWidth:"680px", display:"flex", flexDirection:"column", height:"calc(100vh - 140px)"}}>
                <div style={{background:"rgba(0,51,204,0.08)", borderRadius:"12px", padding:"10px 16px", marginBottom:"16px", fontSize:"12px", color:"#0033cc", border:"1px solid rgba(0,51,204,0.15)"}}>
                  💡 Answer each question to build your AAR. The AI will collect all required info and generate your formal report automatically.
                </div>
                <div ref={chatRef} style={{flex:1, overflowY:"auto", paddingRight:"4px"}}>
                  {messages.map(renderMessage)}
                  {loading && (
                    <div style={{display:"flex", marginBottom:"12px"}}>
                      <div style={{width:"32px", height:"32px", borderRadius:"50%", background:"linear-gradient(135deg,#0033cc,#0099ff)", display:"flex", alignItems:"center", justifyContent:"center", color:"#fff", fontSize:"11px", fontWeight:"bold", flexShrink:0, marginRight:"8px"}}>AI</div>
                      {streamingText ? (
                        <div style={{maxWidth:"72%", padding:"10px 14px", borderRadius:"18px 18px 18px 4px", background:"#f0f4ff", color:"#1a1a2e", fontSize:"14px", lineHeight:"1.6", boxShadow:"0 2px 8px rgba(0,0,50,0.1)", whiteSpace:"pre-wrap", wordBreak:"break-word"}}
                          dangerouslySetInnerHTML={{__html: renderMarkdown(streamingText)}}
                        />
                      ) : (
                        <div style={{background:"#f0f4ff", padding:"12px 16px", borderRadius:"18px 18px 18px 4px", display:"flex", gap:"4px", alignItems:"center"}}>
                          {[0,1,2].map(i => <div key={i} style={{width:"7px", height:"7px", borderRadius:"50%", background:"#0033cc", animation:"bounce 1s infinite", animationDelay:`${i*0.15}s`}}/>)}
                        </div>
                      )}
                    </div>
                  )}
                </div>
                <div style={{display:"flex", gap:"10px", marginTop:"16px"}}>
                  <input
                    value={input}
                    onChange={e => setInput(e.target.value)}
                    onKeyDown={e => e.key==="Enter" && !e.shiftKey && sendMessage()}
                    placeholder="Type your answer..."
                    style={{flex:1, padding:"12px 18px", borderRadius:"24px", border:"2px solid #c0ccff", outline:"none", fontSize:"14px", background:"#fff", transition:"border .2s"}}
                    onFocus={e => e.target.style.border="2px solid #0033cc"}
                    onBlur={e => e.target.style.border="2px solid #c0ccff"}
                  />
                  <button onClick={sendMessage} disabled={loading} style={{
                    padding:"12px 24px", borderRadius:"24px", border:"none", cursor:"pointer",
                    background: loading ? "#aaa" : "linear-gradient(135deg,#0033cc,#0055ff)",
                    color:"#fff", fontWeight:"700", fontSize:"14px", transition:"all .2s"
                  }}>Send</button>
                </div>
              </div>
            ) : (
              <div style={{width:"100%", maxWidth:"850px"}}>
                {reportData ? (
                  <div style={{background:"#fff", borderRadius:"12px", overflow:"hidden", boxShadow:"0 4px 24px rgba(0,0,100,0.15)"}}>
                    <ReportPreview data={reportData} photos={photos} onUpdate={updateReportData} headerImg={headerImgData} footerImg={footerImgData}/>
                  </div>
                ) : (
                  <div style={{textAlign:"center", padding:"80px 24px", color:"#666"}}>
                    <div style={{fontSize:"48px", marginBottom:"16px"}}>📋</div>
                    <div style={{fontSize:"20px", fontWeight:"600", color:"#333", marginBottom:"8px"}}>No report yet</div>
                    <div>Complete the chat conversation to generate your report.</div>
                    <button onClick={() => setTab("chat")} style={{marginTop:"20px", padding:"10px 24px", borderRadius:"20px", border:"none", background:"#0033cc", color:"#fff", fontWeight:"600", cursor:"pointer"}}>Go to Chat →</button>
                  </div>
                )}
              </div>
            )}
          </div>

          <style>{`
            @keyframes bounce { 0%,80%,100%{transform:translateY(0)} 40%{transform:translateY(-6px)} }
            * { box-sizing: border-box; }
            ::-webkit-scrollbar { width: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #c0ccff; border-radius: 3px; }
          `}</style>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<AARApp/>);
  </script>
</body>
</html>
